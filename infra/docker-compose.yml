name: fitness-ai

# Settings every Java service shares: where to find user-service's JWKS, the
# issuer they all validate, and Redis (events, caching, revocation).
x-service-env: &service-env
  USER_SERVICE_HOST: user-service
  JWT_ISSUER: fitness-ai-user-service
  REDIS_HOST: redis

services:
  # ── Infra ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitnessai
      POSTGRES_PASSWORD: fitnessai
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitnessai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/fitnessai123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard builds MinIO from source.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fitnessai
      MINIO_ROOT_PASSWORD: fitnessai123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── Services ─────────────────────────────────────────────────────────────
  # Only the gateway publishes a host port. The services are reachable only on
  # the compose network, so nothing can bypass the gateway's token-revocation
  # check and rate limits. To debug one directly, temporarily add a ports: entry.

  api-gateway:
    build: ../backend/services/api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      PROFILE_SERVICE_HOST: profile-service
      CHAT_SERVICE_HOST: chat-service
      FILE_SERVICE_HOST: file-service
      CHARTS_SERVICE_HOST: charts-service
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      redis:
        condition: service_healthy

  user-service:
    build: ../backend/services/user-service
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_NAME: user_db
      DB_USERNAME: fitnessai
      DB_PASSWORD: fitnessai
      JWT_KEY_DIR: /app/keys
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
    volumes:
      # Persists the RS256 signing key; without it every rebuild logs everyone out.
      - jwt_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  profile-service:
    build: ../backend/services/profile-service
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_NAME: profile_db
      DB_USERNAME: fitnessai
      DB_PASSWORD: fitnessai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    build: ../backend/services/chat-service
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_NAME: chat_db
      DB_USERNAME: fitnessai
      DB_PASSWORD: fitnessai
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      KNOWLEDGE_SERVICE_HOST: knowledge-service
      PROFILE_SERVICE_HOST: profile-service
      FILE_SERVICE_HOST: file-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  knowledge-service:
    build: ../backend/services/knowledge-service
    # Qdrant has no healthcheck and the vector store creates its collection
    # at startup, so a too-early start just restarts until Qdrant is up.
    restart: unless-stopped
    environment:
      <<: *service-env
      QDRANT_HOST: qdrant
      NEO4J_HOST: neo4j
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: fitnessai123
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy

  file-service:
    build: ../backend/services/file-service
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_NAME: file_db
      DB_USERNAME: fitnessai
      DB_PASSWORD: fitnessai
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: fitnessai
      MINIO_SECRET_KEY: fitnessai123
      KNOWLEDGE_SERVICE_HOST: knowledge-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  charts-service:
    build: ../backend/services/charts-service
    restart: unless-stopped
    environment:
      <<: *service-env
      PROFILE_SERVICE_HOST: profile-service
      CHAT_SERVICE_HOST: chat-service
      FILE_SERVICE_HOST: file-service
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  jwt_keys:
