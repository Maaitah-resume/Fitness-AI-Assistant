server:
  port: 8085

spring:
  application:
    name: file-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_db}
    username: ${DB_USERNAME:fitnessai}
    password: ${DB_PASSWORD:fitnessai}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:fitnessai}
  secret-key: ${MINIO_SECRET_KEY:fitnessai123}
  bucket: ${MINIO_BUCKET:fitness-documents}

jwt:
  issuer: ${JWT_ISSUER:fitness-ai-user-service}
  jwk-set-uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}/.well-known/jwks.json

services:
  knowledge-service:
    base-url: http://${KNOWLEDGE_SERVICE_HOST:localhost}:${KNOWLEDGE_SERVICE_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
