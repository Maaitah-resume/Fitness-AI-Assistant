# Same routing table as application.yml minus the Redis-backed rate limiters.
# Lists bind wholesale from the highest-priority source, so the whole table is
# restated here rather than patched by index.
spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie
          routes:
            - id: chat-send
              order: -1
              uri: http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
              predicates:
                - Path=/api/v1/chat/send
            - id: user-service
              uri: http://${USER_SERVICE_HOST}:${USER_SERVICE_PORT}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users,/api/v1/users/**
            - id: profile-service
              uri: http://${PROFILE_SERVICE_HOST}:${PROFILE_SERVICE_PORT}
              predicates:
                - Path=/api/v1/profile/**
            - id: chat-service
              uri: http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
              predicates:
                - Path=/api/v1/chat/**
            - id: file-service
              uri: http://${FILE_SERVICE_HOST}:${FILE_SERVICE_PORT}
              predicates:
                - Path=/api/v1/files,/api/v1/files/**
            - id: charts-service
              uri: http://${CHARTS_SERVICE_HOST}:${CHARTS_SERVICE_PORT}
              predicates:
                - Path=/api/v1/charts/**
