server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # user-service also serves the public /api/v1/auth/** endpoints
            - id: user-service
              uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: profile-service
              uri: http://${PROFILE_SERVICE_HOST:localhost}:${PROFILE_SERVICE_PORT:8082}
              predicates:
                - Path=/api/v1/profile/**
            - id: chat-service
              uri: http://${CHAT_SERVICE_HOST:localhost}:${CHAT_SERVICE_PORT:8083}
              predicates:
                - Path=/api/v1/chat/**
            - id: file-service
              uri: http://${FILE_SERVICE_HOST:localhost}:${FILE_SERVICE_PORT:8085}
              predicates:
                - Path=/api/v1/files/**
            - id: charts-service
              uri: http://${CHARTS_SERVICE_HOST:localhost}:${CHARTS_SERVICE_PORT:8086}
              predicates:
                - Path=/api/v1/charts/**
          # knowledge-service is intentionally NOT routed here — it's an
          # internal-only service called by chat-service/file-service, never
          # directly by the frontend. See docs/spring-boot-microservices-plan.md.

management:
  endpoints:
    web:
      exposure:
        include: health,info
