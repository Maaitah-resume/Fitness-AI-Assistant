server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Auth is bearer-token only; cookies have no business reaching services.
            - RemoveRequestHeader=Cookie
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 30
                key-resolver: "#{@userKeyResolver}"
          routes:
            # Each chat message costs an LLM call (plus tool calls), so it gets
            # its own tighter bucket on top of the default one.
            - id: chat-send
              order: -1
              uri: http://${CHAT_SERVICE_HOST:localhost}:${CHAT_SERVICE_PORT:8083}
              predicates:
                - Path=/api/v1/chat/send
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 6
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
            # user-service also serves the public /api/v1/auth/** endpoints
            - id: user-service
              uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users,/api/v1/users/**
            - id: profile-service
              uri: http://${PROFILE_SERVICE_HOST:localhost}:${PROFILE_SERVICE_PORT:8082}
              predicates:
                - Path=/api/v1/profile/**
            - id: chat-service
              uri: http://${CHAT_SERVICE_HOST:localhost}:${CHAT_SERVICE_PORT:8083}
              predicates:
                - Path=/api/v1/chat/**
            - id: file-service
              uri: http://${FILE_SERVICE_HOST:localhost}:${FILE_SERVICE_PORT:8085}
              predicates:
                - Path=/api/v1/files,/api/v1/files/**
            - id: charts-service
              uri: http://${CHARTS_SERVICE_HOST:localhost}:${CHARTS_SERVICE_PORT:8086}
              predicates:
                - Path=/api/v1/charts/**
          # knowledge-service is intentionally NOT routed here — it's internal,
          # called only by chat-service and file-service.

jwt:
  issuer: ${JWT_ISSUER:fitness-ai-user-service}
  jwk-set-uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}/.well-known/jwks.json

gateway:
  cors:
    # Comma-separated. The Vite dev server by default; add your deployed frontend origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
