server:
  port: 8084

spring:
  application:
    name: knowledge-service
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:fitnessai123}
  ai:
    openai:
      # Spring AI refuses to start with an empty key; the placeholder lets the
      # service boot and report the problem (see AppConfig) instead of crash-looping.
      api-key: ${OPENAI_API_KEY:sk-not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.0
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: fitness_docs
        use-tls: false
        initialize-schema: true

jwt:
  issuer: ${JWT_ISSUER:fitness-ai-user-service}
  jwk-set-uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
