server:
  port: 8084

spring:
  application:
    name: knowledge-service
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:fitnessai123}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: fitness_docs
        use-tls: false
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
