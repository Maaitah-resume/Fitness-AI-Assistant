server:
  port: 8086

spring:
  application:
    name: charts-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Base URLs for the internal stats endpoints this service aggregates.
# Read later via @ConfigurationProperties(prefix = "services").
services:
  user-service:
    base-url: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8081}
  profile-service:
    base-url: http://${PROFILE_SERVICE_HOST:localhost}:${PROFILE_SERVICE_PORT:8082}
  chat-service:
    base-url: http://${CHAT_SERVICE_HOST:localhost}:${CHAT_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
